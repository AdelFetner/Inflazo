name: Actualizar datos INDEC

on:
  schedule:
    - cron: '17 12 * * *' # 09:17 ART (odd minute: :00 runs get delayed or dropped under load)
    - cron: '17 21 * * *' # 18:17 ART
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data
        env:
          INDEC_API_TOKEN: ${{ secrets.INDEC_API_TOKEN }}
      - name: Commit data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: actualizar precios y puzzles del INDEC"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # Vercel Hobby does not deploy bot-authored commits on private repos; trigger a Deploy Hook instead.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel deploy hook"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
